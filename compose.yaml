services:

  bootstrap:
    image: alpine:3.20
    container_name: docker-local-hosting-bootstrap
    restart: "no"
    networks:
      - ${LOCAL_HOSTING_NETWORK:-local-hosting}
    volumes:
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
      - ./certs:/certs:ro
    environment:
      - TLS_CERT_FILE=/certs/home.arpa.pem
      - TLS_KEY_FILE=/certs/home.arpa-key.pem
    entrypoint: ["/bin/sh", "/bootstrap.sh"]

  traefik:
    image: traefik:v3.7.9
    container_name: traefik
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ${LOCAL_HOSTING_NETWORK:-local-hosting}
      - traefik-socket
    volumes:
      - ./config/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    environment:
      - TZ=${TZ:-Europe/Kyiv}
    labels:
      - "traefik.enable=true"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: docker-socket-proxy
    restart: unless-stopped
    networks:
      - traefik-socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - POST=0
      - LOG_LEVEL=info
    labels:
      - "traefik.enable=false"

  demo:
    image: nginx:1.27-alpine
    container_name: docker-local-hosting-demo
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ${LOCAL_HOSTING_NETWORK:-local-hosting}
    volumes:
      - ./examples/nginx-demo/public:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demo.rule=Host(`${DEMO_HOST:-demo.home.arpa}`)"
      - "traefik.http.routers.demo.entrypoints=websecure"
      - "traefik.http.routers.demo.tls=true"
      - "traefik.http.services.demo.loadbalancer.server.port=80"

networks:
  local-hosting:
    name: ${LOCAL_HOSTING_NETWORK:-local-hosting}
    driver: bridge
    attachable: true
  traefik-socket:
    internal: true
    name: traefik-socket
