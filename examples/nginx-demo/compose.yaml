services:
  demo:
    image: nginx:1.27-alpine
    container_name: docker-local-hosting-demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - local-hosting
      - default
    volumes:
      - ./public:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demo.rule=Host(`demo.home.arpa`)"
      - "traefik.http.routers.demo.entrypoints=websecure"
      - "traefik.http.routers.demo.tls=true"
      - "traefik.http.services.demo.loadbalancer.server.port=80"

networks:
  local-hosting:
    external: true
