# Приклад налаштування Laravel-проєкту для локального хостингу
# Скопіюйте цей файл у свій Laravel-проєкт як compose.yaml
# Налаштуйте змінні середовища у .env вашого Laravel-проєкту

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    networks:
      - local-hosting
      - laravel
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      # Основний домен
      - "traefik.enable=true"
      - "traefik.http.routers.myproject.rule=Host(`myproject.home.arpa`)"
      - "traefik.http.routers.myproject.entrypoints=websecure"
      - "traefik.http.routers.myproject.tls=true"
      - "traefik.http.services.myproject.loadbalancer.server.port=80"
      # API піддомен (або використовуйте myproject-api.home.arpa для спрощення TLS)
      - "traefik.http.routers.myproject-api.rule=Host(`api.myproject.home.arpa`)"
      - "traefik.http.routers.myproject-api.entrypoints=websecure"
      - "traefik.http.routers.myproject-api.tls=true"
      - "traefik.http.services.myproject-api.loadbalancer.server.port=80"

  php-fpm:
    image: php:8.3-fpm-alpine
    restart: unless-stopped
    networks:
      - laravel
    volumes:
      - ./:/var/www/html:ro
    environment:
      - APP_URL=https://myproject.home.arpa

networks:
  local-hosting:
    external: true
  laravel:
    internal: true
