# Приклад налаштування Laravel-проєкту для локального хостингу
# Змініть назви router, service та домен.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - ${LOCAL_HOSTING_NETWORK:-local-hosting}
      - laravel
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myproject.rule=Host(`${APP_DOMAIN:-myproject.home.arpa}`)"
      - "traefik.http.routers.myproject.entrypoints=websecure"
      - "traefik.http.routers.myproject.tls=true"
      - "traefik.http.services.myproject.loadbalancer.server.port=80"
      - "traefik.http.routers.myproject-api.rule=Host(`api.${APP_DOMAIN:-myproject.home.arpa}`)"
      - "traefik.http.routers.myproject-api.entrypoints=websecure"
      - "traefik.http.routers.myproject-api.tls=true"
      - "traefik.http.services.myproject-api.loadbalancer.server.port=80"

  php-fpm:
    image: php:8.3-fpm-alpine
    restart: unless-stopped
    networks:
      - laravel
    volumes:
      - ./:/var/www/html:ro
    environment:
      - APP_URL=https://${APP_DOMAIN:-myproject.home.arpa}

networks:
  local-hosting:
    external: true
    name: ${LOCAL_HOSTING_NETWORK:-local-hosting}
  laravel:
    internal: true
